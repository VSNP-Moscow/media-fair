name: media-fair

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=96M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=40
      - --mysqlx=OFF
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - mf_db:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 340m
    networks:
      - mf

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL: 6
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY: "true"
      TZ: Europe/Moscow
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BIND_PORT:-4010}:8080"
    mem_limit: 224m
    security_opt:
      - no-new-privileges:true
    networks:
      - mf

volumes:
  mf_db:

networks:
  mf:
    driver: bridge
